{{- if not .Values.secrets.existingSecret }}
{{- /*
Generated once. `lookup` returns the live Secret on upgrade, so the values
are kept: regenerating the signing key would invalidate every return path
already sent, and the passwords would stop matching the database.
`helm template` has no cluster to look at and generates fresh values each
time, which is fine for a dry run.
*/ -}}
{{- $name := include "postier.fullname" . }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $gen := dict }}
{{- range $key := list "signing-key" "ingest-token" "kumo-inject-password" "postgres-owner-password" "postgres-app-password" "postgres-system-password" }}
{{- if hasKey $live $key }}
{{- $_ := set $gen $key (index $live $key | b64dec) }}
{{- else }}
{{- $_ := set $gen $key (randAlphaNum 48) }}
{{- end }}
{{- end }}
{{- $host := printf "%s-postgres.%s.svc:5432" $name .Release.Namespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "postier.labels" . | nindent 4 }}
type: Opaque
stringData:
  # HMAC key of return paths and Message-IDs. Shared by dispatch and ingest.
  signing-key: {{ index $gen "signing-key" | quote }}
  # Bearer token KumoMTA presents to ingest.
  ingest-token: {{ index $gen "ingest-token" | quote }}
  # Basic-auth password dispatch presents to KumoMTA's injection API.
  kumo-inject-password: {{ index $gen "kumo-inject-password" | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-owner-password: {{ index $gen "postgres-owner-password" | quote }}
  postgres-app-password: {{ index $gen "postgres-app-password" | quote }}
  postgres-system-password: {{ index $gen "postgres-system-password" | quote }}
  # One URL per role (docs/implementation-plan.md §2.5).
  migrate-database-url: {{ printf "postgres://postier:%s@%s/postier" (index $gen "postgres-owner-password") $host | quote }}
  database-url: {{ printf "postgres://postier_app:%s@%s/postier" (index $gen "postgres-app-password") $host | quote }}
  system-database-url: {{ printf "postgres://postier_system:%s@%s/postier" (index $gen "postgres-system-password") $host | quote }}
  {{- else }}
  {{- fail "postgres.enabled=false requires secrets.existingSecret, holding database-url, system-database-url and migrate-database-url" }}
  {{- end }}
{{- end }}
