{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" (include "postier.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "postier.labels" . | nindent 4 }}
data:
  # The two runtime roles. Passwords come from the environment, so that they
  # never sit in a ConfigMap.
  10-roles.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -v app_password="$POSTIER_APP_PASSWORD" -v system_password="$POSTIER_SYSTEM_PASSWORD" <<'SQL'
    CREATE ROLE postier_app LOGIN PASSWORD :'app_password';
    CREATE ROLE postier_system LOGIN PASSWORD :'system_password' BYPASSRLS;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "postier.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "postier.selector" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "postier.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "postier.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postier.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: postier
            - name: POSTGRES_DB
              value: postier
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- include "postier.secretEnv" (list . "POSTGRES_PASSWORD" "postgres-owner-password") | nindent 12 }}
            {{- include "postier.secretEnv" (list . "POSTIER_APP_PASSWORD" "postgres-app-password") | nindent 12 }}
            {{- include "postier.secretEnv" (list . "POSTIER_SYSTEM_PASSWORD" "postgres-system-password") | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postier", "-d", "postier"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postier", "-d", "postier"]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
