    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SendingDomain declares a domain a project sends from. The operator
          generates its DKIM key, lists the DNS records to publish in the status,
          checks them, and only then lets the domain send.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SendingDomainSpec describes a domain mail is sent from.
            properties:
              dkim:
                default: {}
                description: DKIMSpec configures the DKIM signature of a domain.
                properties:
                  selector:
                    default: pst1
                    description: |-
                      Selector of the DKIM key. Immutable: changing the key of a domain is a
                      rotation, which publishes a new selector before using it.
                    pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - message: selector is immutable
                      rule: self == oldSelf
                type: object
              domain:
                description: |-
                  Domain is the domain of the From address, in lowercase ASCII
                  (punycode for an internationalised name).
                maxLength: 253
                pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
