                x-kubernetes-validations:
                - message: domain is immutable
                  rule: self == oldSelf
              projectRef:
                description: ProjectRef is the project allowed to send from this domain.
                properties:
                  name:
                    description: Name of the Project.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: projectRef is immutable
                  rule: self == oldSelf
              returnPath:
                default: {}
                description: ReturnPathSpec configures the envelope sender domain.
                properties:
                  subdomain:
                    default: bounce
                    description: |-
                      Subdomain of the sending domain that receives bounces. Its MX must
                      point at the platform.
                    pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                type: object
            required:
            - domain
            - projectRef
            type: object
