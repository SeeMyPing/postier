                format: int64
                type: integer
              requiredRecords:
                description: RequiredRecords lists the DNS records to publish for
                  this domain.
                items:
                  description: DNSRecord is a record the owner of the domain has to
                    publish.
                  properties:
                    name:
                      description: Name of the record, fully qualified, without the
                        trailing dot.
                      type: string
                    purpose:
                      description: Purpose says what the record is for.
                      type: string
                    type:
                      description: 'Type of the record: TXT or MX.'
                      type: string
                    value:
                      description: Value to publish.
                      type: string
                  required:
                  - name
                  - purpose
                  - type
                  - value
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
