---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: apicredentials.postier.dev
spec:
  group: postier.dev
  names:
    kind: ApiCredential
    listKind: ApiCredentialList
    plural: apicredentials
    singular: apicredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectRef.name
      name: Project
      type: string
    - jsonPath: .status.prefix
      name: Prefix
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApiCredential issues an API key for a project. The operator generates the
          key, stores its hash in the database and writes the key itself to a Secret
          of the same namespace, for the workloads to mount. Deleting the resource
          revokes the key.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApiCredentialSpec describes an API key.
            properties:
              environment:
                default: live
                description: |-
                  Environment is the tag embedded in the key ("pst_live_…"), so that a
                  leaked key says what it opens.
                enum:
                - live
                - test
                type: string
                x-kubernetes-validations:
                - message: environment is immutable
                  rule: self == oldSelf
              projectRef:
                description: ProjectRef is the project the key acts for.
                properties:
                  name:
                    description: Name of the Project.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: projectRef is immutable
                  rule: self == oldSelf
              scopes:
                default:
                - send
                - read
                description: Scopes of the key. "admin" implies the others.
                items:
                  description: Scope is a permission of an API key.
                  enum:
                  - send
                  - read
                  - suppressions
                  - admin
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              secretName:
                description: |-
                  SecretName is the Secret the key is written to, in the namespace of
                  the credential. Defaults to the name of the credential.
                type: string
                x-kubernetes-validations:
                - message: secretName is immutable
                  rule: self == oldSelf
            required:
            - projectRef
            type: object
          status:
            description: ApiCredentialStatus is the observed state of an ApiCredential.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation the conditions refer
                  to.
                format: int64
                type: integer
              prefix:
                description: Prefix is the public part of the key, as it appears in
                  logs.
                type: string
              secretName:
                description: SecretName is the Secret that holds the key.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
